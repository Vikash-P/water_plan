<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WaterMart order — mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0050C8}a:hover{color:#003B94}
@keyframes wmWave{0%,100%{scale:1 1}50%{scale:0.92 1.6}}
@keyframes wmRise{from{opacity:0;translate:0 24px}to{opacity:1;translate:0 0}}
@keyframes wmFloat{0%,100%{translate:0 0}50%{translate:0 -6px}}
.wm-press{transition:translate .12s ease,border-color .2s ease,box-shadow .2s ease}.wm-press:active{translate:0 3px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F2F7FB; font-family: Inter, system-ui, sans-serif; color: #0B1F33; display: flex; flex-direction: column">

<div style="padding: 20px 20px 12px; display: flex; align-items: center; gap: 12px">
<a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DCE6F0; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B1F33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<div style="flex: 1"><div style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px">Order water</div><div style="font-size: 13px; color: #4A5B6E">Andheri West · about 2 hrs</div></div>
</div>

<div style="flex: 1; overflow-y: auto; padding: 4px 20px 140px; display: flex; flex-direction: column; gap: 16px">

<!-- product hero card with 3D jar stack -->
<div style="position: relative; background: #FFFFFF; border-radius: 24px; padding: 20px; animation: wmRise 0.6s ease-out both; box-shadow: 0 6px 0 #D3E1EE, 0 18px 30px rgba(11,31,51,0.08); display: flex; gap: 16px; align-items: center">
<div style="position: relative; width: 104px; height: 140px; flex: 0 0 auto; animation: wmFloat 3.5s ease-in-out infinite" aria-hidden="true">
<div style="position: absolute; left: 12px; bottom: -6px; width: 80px; height: 14px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(11,31,51,0.3), rgba(11,31,51,0) 70%)"></div>
<div style="position: absolute; left: 36px; top: 0; width: 32px; height: 15px; border-radius: 6px 6px 3px 3px; background: linear-gradient(90deg, #00337F, #2B86FF 42%, #00337F)"></div>
<div style="position: absolute; left: 40px; top: 14px; width: 24px; height: 12px; background: linear-gradient(90deg, #8EBEE6, #EAF6FF 45%, #9CC6EA)"></div>
<div style="position: absolute; left: 6px; top: 24px; width: 92px; height: 114px; border-radius: 40px 40px 16px 16px; overflow: hidden; background: linear-gradient(90deg, #8FBDE6, #EEF8FF 36%, #B7D8F3 68%, #7FAEDB)">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: {{fill}}; transition: height 0.6s cubic-bezier(0.3, 1.4, 0.5, 1); background: linear-gradient(90deg, #0B5FD0, #4FA9FF 36%, #1F7DE6 68%, #0A4FAE)"><div style="position: absolute; left: 0; right: 0; top: -5px; height: 10px; border-radius: 50%; background: #8FD2FF; animation: wmWave 2.4s ease-in-out infinite"></div></div>
<div style="position: absolute; left: 16px; top: 14px; width: 9px; height: 84px; border-radius: 6px; background: rgba(255,255,255,0.55)"></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #1D3A57">RAJPUT WATERS</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px">Rajput Water 20L</span>
<span style="font-size: 14px; color: #3A4F64">₹30 per jar · ISI sealed</span>
<span style="align-self: flex-start; padding: 4px 10px; border-radius: 999px; background: #E5F0FF; color: #0047B3; font-size: 12px; font-weight: 600">Verified plant</span>
</div>
</div>

<!-- quantity -->
<div style="background: #FFFFFF; border-radius: 20px; padding: 18px; border: 1px solid #DCE6F0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-weight: 600; font-size: 16px">How many jars?</span>
<div style="display: flex; align-items: center; gap: 4px; background: #EEF4FA; border-radius: 16px; padding: 4px">
<button type="button" class="wm-press" aria-label="Fewer jars" onClick="{{dec}}" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: #FFFFFF; box-shadow: 0 3px 0 #C6D5E4; font-size: 22px; font-weight: 600; color: #0B1F33; cursor: pointer">−</button>
<span style="min-width: 40px; text-align: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px">{{jars}}</span>
<button type="button" class="wm-press" aria-label="More jars" onClick="{{inc}}" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: #0057D9; box-shadow: 0 3px 0 #003C99; font-size: 22px; font-weight: 600; color: #FFFFFF; cursor: pointer">+</button>
</div>
</div>
<button type="button" onClick="{{toggleSwap}}" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 14px; border: 1px solid {{swapBorder}}; background: {{swapBg}}; font: inherit; text-align: left; color: #0B1F33; cursor: pointer">
<span style="width: 22px; height: 22px; flex: 0 0 auto; border-radius: 7px; border: 2px solid #0057D9; background: {{swapBox}}; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
<span style="font-size: 14px; line-height: 1.4">I have WaterMart jars to swap <span style="color: #4A5B6E">(no new deposit)</span></span>
</button>
</div>

<!-- address -->
<div style="background: #FFFFFF; border-radius: 20px; padding: 18px; border: 1px solid #DCE6F0; display: flex; flex-direction: column; gap: 10px">
<label for="addr" style="font-weight: 600; font-size: 16px">Deliver to</label>
<input id="addr" type="text" placeholder="Flat, building, society" style="border: 1px solid #C6D5E4; border-radius: 12px; padding: 14px; font: inherit; font-size: 15px; color: #0B1F33; background: #FFFFFF">
<button type="button" style="align-self: flex-start; min-height: 44px; border: 0; background: transparent; padding: 0; font: inherit; font-size: 14px; font-weight: 600; color: #0050C8; display: flex; align-items: center; gap: 6px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0050C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="10" r="3"></circle><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"></path></svg>Use my location</button>
</div>

<!-- slot -->
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-weight: 600; font-size: 16px">When?</span>
<sc-for list="{{slots}}" as="s" hint-placeholder-count="3">
<button type="button" class="wm-press" onClick="{{s.pick}}" style="display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 56px; padding: 12px 16px; border-radius: 16px; border: 2px solid {{s.border}}; background: #FFFFFF; box-shadow: {{s.shadow}}; font: inherit; color: #0B1F33; cursor: pointer; text-align: left">
<span style="font-weight: 600">{{s.label}}</span><span style="font-size: 14px; color: #4A5B6E">{{s.time}}</span>
</button>
</sc-for>
</div>
</div>

<!-- sticky summary -->
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 22px; background: #FFFFFF; border-radius: 24px 24px 0 0; box-shadow: 0 -10px 30px rgba(11,31,51,0.12); display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; font-size: 14px; color: #3A4F64"><span>{{jars}} × ₹30 water · deposit ₹{{deposit}}</span><span>Refunded on return</span></div>
<a href="Track.dc.html" class="wm-press" style="display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-radius: 16px; background: #0057D9; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 16px; box-shadow: 0 5px 0 #003C99"><span>Request delivery</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px">₹{{total}}</span></a>
<span style="font-size: 12px; color: #4A5B6E; text-align: center">No payment now. UPI link arrives on WhatsApp.</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { jars: 1, swap: false, slot: 'asap' };
  }
  renderVals() {
    const jars = this.state.jars;
    const swap = this.state.swap;
    const deposit = swap ? 0 : jars * 100;
    const total = jars * 30 + deposit;
    const defs = [
      { id: 'asap', label: 'ASAP', time: 'Within about 2 hrs' },
      { id: 'am', label: 'Tomorrow morning', time: '8 am – 12 pm' },
      { id: 'pm', label: 'Tomorrow evening', time: '4 pm – 8 pm' }
    ];
    const slots = defs.map((d) => {
      const on = this.state.slot === d.id;
      return Object.assign({}, d, {
        border: on ? '#0057D9' : '#DCE6F0',
        shadow: on ? '0 4px 0 #0047B3' : '0 3px 0 #DCE6F0',
        pick: () => this.setState({ slot: d.id })
      });
    });
    return {
      jars: jars,
      deposit: deposit,
      total: total,
      fill: (40 + jars * 10) + '%',
      slots: slots,
      swapBorder: swap ? '#0057D9' : '#DCE6F0',
      swapBg: swap ? '#EEF5FF' : '#FFFFFF',
      swapBox: swap ? '#0057D9' : '#FFFFFF',
      inc: () => this.setState({ jars: Math.min(5, jars + 1) }),
      dec: () => this.setState({ jars: Math.max(1, jars - 1) }),
      toggleSwap: () => this.setState({ swap: !swap })
    };
  }
}
</script>
</body>
</html>
